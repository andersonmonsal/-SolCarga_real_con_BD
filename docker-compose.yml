version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=solcarga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  solcarga-app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/solcarga
      - JWT_SECRET=solcarga_clave_super_secreta_2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - /app/backend/node_modules # Prevent overwriting node_modules
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
